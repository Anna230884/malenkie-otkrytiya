<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5ef"><title>Маленькие открытия — игры на липучках</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#f8f5ef;--card:#fff;--text:#403c38;--muted:#8c857e;--accent:#d98b73;--accent2:#e7b47d;--line:#eee7df;--shadow:0 10px 30px rgba(80,60,40,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito Sans',sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:90px}.top{padding:22px 18px 8px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:Comfortaa;font-weight:700;font-size:23px}.brand small{display:block;font:600 12px 'Nunito Sans';color:var(--muted);margin-top:3px}.icon{border:0;background:white;width:44px;height:44px;border-radius:15px;box-shadow:var(--shadow);font-size:20px}.hero{margin:12px 18px;padding:24px;border-radius:28px;background:linear-gradient(135deg,#f2dfd3,#f7eecf);position:relative;overflow:hidden}.hero h1{font-family:Comfortaa;font-size:27px;margin:0 0 8px;max-width:440px}.hero p{margin:0;max-width:470px;color:#6e655d;line-height:1.45}.chips{display:flex;gap:8px;overflow:auto;padding:16px 18px 5px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:999px;color:#655e58}.chip.active{background:#403c38;color:#fff}.section{padding:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section h2{font-family:Comfortaa;margin:0;font-size:21px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);position:relative}.pic{aspect-ratio:1/1;background:#f1ece6;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:12px}.badge{font-size:11px;color:#9a6c55;background:#f8e9df;border-radius:999px;padding:5px 8px;display:inline-block}.name{font-weight:700;margin:8px 0 4px;line-height:1.2}.desc{font-size:12px;color:#8b827a;line-height:1.35;min-height:32px}.price-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.price{font-weight:700}.add{border:0;background:var(--accent);color:#fff;border-radius:13px;padding:9px 11px;font-weight:700}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:10px 12px 13px;z-index:5}.nav{border:0;background:transparent;color:#777;padding:7px;font-size:12px}.nav b{display:block;font-size:20px;margin-bottom:2px}.nav.active{color:var(--accent)}.fab{position:fixed;right:max(18px,calc((100vw - 720px)/2 + 18px));bottom:84px;background:#403c38;color:#fff;border:0;border-radius:18px;padding:13px 17px;box-shadow:var(--shadow);font-weight:700;z-index:4}.count{display:inline-flex;min-width:20px;height:20px;border-radius:10px;background:#d98b73;color:#fff;align-items:center;justify-content:center;font-size:11px;margin-left:4px}.panel{display:none;padding:18px}.panel.show{display:block}.cart-item{display:flex;gap:12px;background:#fff;border:1px solid var(--line);padding:12px;border-radius:18px;margin-bottom:10px}.cart-item img{width:76px;height:76px;border-radius:14px;object-fit:cover}.cart-info{flex:1}.qty{display:flex;align-items:center;gap:8px;margin-top:7px}.qty button{width:28px;height:28px;border:1px solid var(--line);border-radius:9px;background:#fff}.checkout{width:100%;border:0;background:#403c38;color:#fff;border-radius:16px;padding:14px;font-weight:700;margin-top:12px}.field{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;margin:6px 0;font:inherit;background:#fff}.notice{background:#fff7e8;border:1px solid #f1dfba;padding:12px 14px;border-radius:15px;font-size:13px;line-height:1.4}.empty{text-align:center;padding:40px 10px;color:var(--muted)}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="app"><header class="top"><div class="brand">Маленькие открытия<small>Игры на липучках для детей</small></div><button class="icon" onclick="openCart()">🛒 <span id="cartCount" class="count">0</span></button></header><section class="hero"><h1>Играем. Развиваемся. Открываем новое.</h1><p>Многоразовые развивающие игры на липучках для малышей и дошкольников.</p></section><div class="chips"><button class="chip active" data-age="all">Все игры</button><button class="chip" data-age="1–3">1–3 года</button><button class="chip" data-age="3–5">3–5 лет</button><button class="chip" data-age="5–7">5–7 лет</button></div><main id="catalog" class="section"><div class="section-head"><h2>Новинки на липучках</h2><span class="muted" id="shown"></span></div><div id="grid" class="grid"></div></main><section id="cart" class="panel"><div class="section-head"><h2>Корзина</h2><button class="chip" onclick="showCatalog()">← Каталог</button></div><div id="cartList"></div><div id="cartTotal"></div></section><section id="checkout" class="panel"><div class="section-head"><h2>Оформление заказа</h2><button class="chip" onclick="openCart()">← Корзина</button></div><div class="notice">После отправки заказ сразу поступит владельцу магазина в Telegram.</div><form id="orderForm"><input class="field" name="name" placeholder="Ваше имя" required><input class="field" name="phone" placeholder="Телефон или Telegram" required><input class="field" name="city" placeholder="Город (Бендеры / Тирасполь)" required><textarea class="field" name="comment" placeholder="Комментарий к заказу" rows="4"></textarea><button class="checkout" type="submit">📩 Отправить заказ в Telegram</button></form></section></div><nav class="bottom"><button class="nav active" onclick="showCatalog()"><b>🏠</b>Каталог</button><button class="nav" onclick="openCart()"><b>🛒</b>Корзина</button><button class="nav" onclick="openCheckout()"><b>💬</b>Заказать</button></nav><script>

const products=[
{id:1,age:'1.5–4 года',badge:'🥕 Новинка',name:'Собери урожай',desc:'Фетровый 3D-огород на липучках. 28 деталей, счёт и цвет.',price:1290,img:imgs[0],tags:['1–3']},
{id:2,age:'2–5 лет',badge:'🐻 NEW',name:'Гардероб зверят',desc:'Интерактивная одевашка: 42 элемента и диск погоды.',price:1750,img:imgs[1],tags:['3–5']},
{id:3,age:'3–6 лет',badge:'🚀 Хит',name:'Космос и планеты',desc:'Сенсорный планшет со светом и мягкой ракетой.',price:1890,img:imgs[2],tags:['3–5']},
{id:4,age:'2–5 лет',badge:'🍕 Новинка',name:'Шеф-повар: Пицца',desc:'Кулинарное лото на липучках для сюжетных игр на кухне.',price:1450,img:imgs[3],tags:['3–5']},

{id:6,age:'1–3 года',badge:'🚗 NEW',name:'Звуки: Город',desc:'Тактильная книга с липучками и звуками транспорта.',price:1590,img:imgs[5],tags:['1–3']},
{id:7,age:'1–2.5 года',badge:'👶 Для самых маленьких',name:'Первые цвета и формы',desc:'Тактильные мягкие заплатки на безопасных липучках.',price:1350,img:imgs[6],tags:['1–3']},

{id:11,age:'3–6 лет',badge:'🧩 Нейро',name:'Память: Найди пару',desc:'Тренировка внимания, памяти и зрительного сопоставления.',price:1290,img:imgs[2],tags:['3–5']},
{id:12,age:'2–5 лет',badge:'🌈 Новинка',name:'Цветные заплатки',desc:'Мягкая игра на сопоставление форм и развитие моторики.',price:1190,img:imgs[3],tags:['3–5']}
];
let age='all',cart=JSON.parse(localStorage.getItem('lp_cart')||'[]');
function save(){localStorage.setItem('lp_cart',JSON.stringify(cart));updateCount()}
function updateCount(){document.getElementById('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0)}
function render(){const list=age==='all'?products:products.filter(p=>p.tags.includes(age));document.getElementById('shown').textContent=`${list.length} игр`;document.getElementById('grid').innerHTML=list.map(p=>`<article class="card"><div class="pic"><img src="${p.img}" alt="${p.name}"></div><div class="body"><span class="badge">${p.badge}</span><div class="name">${p.name}</div><div class="muted">${p.age}</div><div class="desc">${p.desc}</div><div class="price-row"><span class="price">${p.price} ₽</span><button class="add" onclick="add(${p.id})">+ В корзину</button></div></div></article>`).join('')}
function add(id){const p=products.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.qty++:cart.push({id,qty:1});save();openCart()}
function openCart(){hidePanels();document.getElementById('cart').classList.add('show');renderCart()}
function showCatalog(){hidePanels();document.getElementById('catalog').style.display='block'}
function hidePanels(){document.getElementById('catalog').style.display='block';document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'))}
function renderCart(){const el=document.getElementById('cartList');if(!cart.length){el.innerHTML='<div class="empty">Корзина пока пустая.<br><br>Выберите понравившуюся игру 💛</div>';document.getElementById('cartTotal').innerHTML='';return}let total=0;el.innerHTML=cart.map(x=>{const p=products.find(y=>y.id===x.id);total+=p.price*x.qty;return `<div class="cart-item"><img src="${p.img}"><div class="cart-info"><b>${p.name}</b><div class="muted">${p.price} ₽ × ${x.qty}</div><div class="qty"><button onclick="change(${x.id},-1)">−</button><b>${x.qty}</b><button onclick="change(${x.id},1)">+</button><button class="chip" style="padding:5px 9px;margin-left:auto" onclick="removeItem(${x.id})">Удалить</button></div></div></div>`}).join('');document.getElementById('cartTotal').innerHTML=`<div style="background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px"><div style="display:flex;justify-content:space-between"><b>Итого</b><b>${total} ₽</b></div><button class="checkout" onclick="openCheckout()">Оформить заказ</button></div>`}
function change(id,d){const x=cart.find(y=>y.id===id);x.qty+=d;if(x.qty<=0)cart=cart.filter(y=>y.id!==id);save();renderCart()}
function removeItem(id){cart=cart.filter(x=>x.id!==id);save();renderCart()}
function openCheckout(){hidePanels();document.getElementById('checkout').classList.add('show')}
document.querySelectorAll('.chip[data-age]').forEach(b=>b.onclick=()=>{age=b.dataset.age;document.querySelectorAll('.chip[data-age]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
document.getElementById('orderForm').addEventListener('submit',e=>{e.preventDefault();if(!cart.length){alert('Сначала добавьте товар в корзину.');return}const fd=new FormData(e.target);let total=0,items=cart.map(x=>{const p=products.find(y=>y.id===x.id);total+=p.price*x.qty;return `${p.name} × ${x.qty} — ${p.price*x.qty} ₽`}).join('\n');const text=`Здравствуйте! Хочу оформить заказ на сайте «Маленькие открытия».\n\n${items}\n\nИтого: ${total} ₽\n\nИмя: ${fd.get('name')}\nТелефон/Telegram: ${fd.get('phone')}\nГород: ${fd.get('city')}\nКомментарий: ${fd.get('comment')||'—'}`;const items=cart.map(x=>{const p=products.find(y=>y.id===x.id);return {name:p.name,qty:x.qty,subtotal:p.price*x.qty}});
try{const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:fd.get('name'),phone:fd.get('phone'),city:fd.get('city'),comment:fd.get('comment')||'',items,total})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Не удалось отправить заказ');alert('Заказ отправлен 💛 Мы свяжемся с вами для подтверждения.');localStorage.removeItem('lipuchki_cart');cart=[];updateCount();showCatalog();e.target.reset()}catch(err){alert(err.message+'\n\nЕсли ошибка повторяется, напишите нам в Telegram.')}});render();updateCount();
